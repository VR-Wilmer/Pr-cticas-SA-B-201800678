# Requisito "Politicas como codigo" #3 (Practica 8): ejecucion sin
# privilegios de root -- nuestro propio chart ya lo hace (runAsNonRoot,
# allowPrivilegeEscalation: false, capabilities drop ALL, ver
# charts/common/templates/_workload.tpl), esta politica lo hace exigible
# para cualquier Pod del cluster, no solo el nuestro.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root
    policies.kyverno.io/category: Practica 8 - Cadena de suministro
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Bloquea cualquier Pod que no declare runAsNonRoot=true y
      allowPrivilegeEscalation=false, a nivel de Pod o de cada contenedor.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "El Pod y cada contenedor deben declarar runAsNonRoot: true y allowPrivilegeEscalation: false."
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              containers:
                - securityContext:
                    allowPrivilegeEscalation: false
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
                    allowPrivilegeEscalation: false
