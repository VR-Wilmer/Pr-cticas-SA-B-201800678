nameOverride: "notificaciones-service"

image:
  repository: p6/notificaciones-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 4400

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 192Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    # El mayor de todos: espera a Postgres (2 bases) + 2 consumer groups Kafka.
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 40

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

# ServiceAccount/Role/RoleBinding: Practica 8 los mueve a Terraform
# (P8/terraform), con el mismo nombre que "common.fullname" -- este chart
# ya no los crea, ver charts/common/templates/_rbac.tpl (eliminado).

ingress:
  enabled: false

configMap:
  data:
    PORT: "4400"
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "notificaciones_db"
    PLATFORM_DB_NAME: "platform_db"
    AUTHZ_SERVICE_URL: "http://identidad-service:4100"
    AUTHZ_MAX_RETRIES: "3"
    AUTHZ_RETRY_BACKOFF_MS: "300"
    KAFKA_BROKERS: "kafka:9092"
    KAFKA_CLIENT_ID: "notificaciones-service"
    KAFKA_TICKET_EVENTS_TOPIC: "ticket-notificaciones"
    KAFKA_CRONJOB_RESUMEN_TOPIC: "cronjob-resumen"

# El Secret "notificaciones-service" (DB_USER, DB_PASSWORD, INTERNAL_SERVICE_SECRET)
# ya no se declara aqui (Practica 8): lo materializa Sealed Secrets, ver
# P8/sealed-secrets/seal-secrets.sh.
