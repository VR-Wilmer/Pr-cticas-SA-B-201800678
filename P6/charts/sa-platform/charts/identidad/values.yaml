nameOverride: "identidad-service"

image:
  repository: p6/identidad-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 4100

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 192Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    # Tolera hasta 30 * 5s = 150s de arranque (espera a Postgres) antes de
    # marcar el pod como fallido.
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

# ServiceAccount/Role/RoleBinding: Practica 8 los mueve a Terraform
# (P8/terraform), con el mismo nombre que "common.fullname" -- este chart
# ya no los crea, ver charts/common/templates/_rbac.tpl (eliminado).

ingress:
  enabled: false

# No sensible (requisito B): va a un ConfigMap.
configMap:
  data:
    PORT: "4100"
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "identidad_db"
    JWT_EXPIRES_IN: "30m"
    ADMIN_NOMBRE: "Administrador"
    ADMIN_EMAIL: "admin@admin.com"
    AGENTE1_NOMBRE: "Agente Soporte Software"
    AGENTE1_EMAIL: "agente.software@mesadeayuda.com"
    AGENTE2_NOMBRE: "Agente Soporte Hardware"
    AGENTE2_EMAIL: "agente.hardware@mesadeayuda.com"

# Sensible (requisito B): va a un Secret. Valores reales se pasan con
# -f secrets.local.yaml (gitignored) -- ver values.example.yaml.
# El Secret "identidad-service" (DB_USER, DB_PASSWORD, JWT_SECRET,
# ADMIN_PASSWORD, AGENTE1_PASSWORD, AGENTE2_PASSWORD) ya no se declara aqui
# (Practica 8): lo materializa Sealed Secrets, ver
# P8/sealed-secrets/seal-secrets.sh.
