apiVersion: v2
name: sa-platform
description: >
  Practica 5 (Software Avanzado, USAC): plataforma de mesa de ayuda (4
  microservicios + API Gateway, heredados de la Practica 4) empaquetada como
  un unico chart de Helm con subcharts, persistencia (PostgreSQL compartido),
  mensajeria asincrona (Kafka), aislamiento de red y RBAC de minimo privilegio
  sobre Kubernetes.
type: application
# version: version del CHART (empaquetado). appVersion: version de la
# APLICACION que contiene. Se versionan por separado a proposito (requisito
# A): un cambio de solo-configuracion sube "version" sin tocar "appVersion".
version: 0.2.0
appVersion: "1.1.0"
dependencies:
  # Library chart interno con los templates reutilizados por los 5 subcharts
  # de servicio (ver charts/common). No renderiza nada por si solo, pero
  # vive fisicamente dentro de charts/ como los demas, asi que Helm exige
  # declararlo aqui tambien.
  - name: common
    version: "0.1.0"
    repository: "file://charts/common"
  - name: identidad
    version: "1.0.0"
    repository: "file://charts/identidad"
  - name: tickets
    version: "1.0.0"
    repository: "file://charts/tickets"
  - name: asignacion
    version: "1.0.0"
    repository: "file://charts/asignacion"
  - name: notificaciones
    version: "1.0.0"
    repository: "file://charts/notificaciones"
  - name: gateway
    version: "1.0.0"
    repository: "file://charts/gateway"
  - name: cronjobs
    version: "1.0.0"
    repository: "file://charts/cronjobs"
  # Dependencias externas (requisito A): base de datos y broker declarados en
  # Chart.yaml y resueltos con `helm dependency update`, no instalados a mano.
  - name: postgresql
    version: "16.7.27"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: kafka
    version: "32.4.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: kafka.enabled
