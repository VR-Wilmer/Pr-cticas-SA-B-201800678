# values-prod.yaml: perfil "productivo" (dentro del alcance de un cluster
# local -- no hay despliegue en nube administrada, ver 3.2 del enunciado).
# Uso: helm install sa-platform . -f values-prod.yaml -f secrets.local.yaml
#
# Es el perfil usado para las evidencias de HPA 2->5 replicas de
# docs/evidencia/06-prueba-carga.md, ya que coincide exactamente con el
# requisito F ("HPA con minimo 2 y maximo 5 replicas").

identidad:
  image:
    tag: "1.0.0"
  hpa:
    minReplicas: 2
    maxReplicas: 5
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 400m, memory: 256Mi }
  configMap:
    data:
      LOG_LEVEL: "warn"

