nameOverride: "asignacion-service"

image:
  repository: p5/asignacion-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 8000

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 192Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true

rbac:
  extraRules: []

ingress:
  enabled: false

configMap:
  data:
    PORT: "8000"
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "asignacion_db"

secret:
  data:
    DB_USER: ""
    DB_PASSWORD: ""
    INTERNAL_SERVICE_SECRET: ""
