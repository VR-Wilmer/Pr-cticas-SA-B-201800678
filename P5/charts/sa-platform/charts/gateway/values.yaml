nameOverride: "gateway"

image:
  repository: p5/gateway
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 4000

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    # El gateway no tiene dependencias propias (ni BD ni broker): arranca rapido.
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true

rbac:
  extraRules: []

# Unica puerta de entrada al cluster (requisito E): el resto de subcharts
# deja ingress.enabled=false.
ingress:
  enabled: true
  className: nginx
  host: sa-p5.local
  # Sin rewrite-target: el gateway ya enruta el path completo (/api/identidad,
  # /api/tickets, ...) el mismo que Docker Compose usaba en P4, asi que el
  # Ingress solo debe reenviar la URI tal cual.
  annotations: {}

configMap:
  data:
    PORT: "4000"
    IDENTIDAD_SERVICE_URL: "http://identidad-service:4100"
    TICKETS_SERVICE_URL: "http://tickets-service:4200"
    ASIGNACION_SERVICE_URL: "http://asignacion-service:8000"
    NOTIFICACIONES_SERVICE_URL: "http://notificaciones-service:4400"

# El Gateway no maneja credenciales propias (no tiene BD ni broker).
secret:
  data: {}
