# Job de Helm hook (post-install/post-upgrade): crea explicitamente los
# topicos Kafka con particiones y retencion declaradas (requisito D: "la
# cola o topico debera ser durable"), en vez de depender de la
# auto-creacion implicita del broker (deshabilitada a proposito en
# kafka.controller.config, ver values.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-topics-init
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics-init
    spec:
      serviceAccountName: kafka-topics-init
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-topics-init
          image: "{{ .Values.kafka.image.registry }}/{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/bash
            - -c
            - |
              set -e
              {{- range .Values.kafkaTopics }}
              echo "Creando topico '{{ .name }}' ({{ .partitions }} particiones, retention.ms={{ .retentionMs }})..."
              kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists \
                --topic {{ .name }} \
                --partitions {{ .partitions }} \
                --replication-factor {{ .replicationFactor }} \
                --config retention.ms={{ .retentionMs }}
              {{- end }}
              echo "Topicos listos:"
              kafka-topics.sh --bootstrap-server kafka:9092 --list
