# Cluster kind de un solo nodo (control-plane + worker combinados) para la
# Practica 5. extraPortMappings expone el Ingress Controller (NodePort
# 80/443 dentro del nodo) en localhost:80/localhost:443 del host, siguiendo
# la receta oficial de kind para ingress-nginx.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
